name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: devsecops-api
  PYTHON_VERSION: "3.12"

jobs:
  # 1. Détection de secrets
  secrets-scan:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # 2. SAST
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep OWASP Top 10 + Python + Flask
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/flask \
            --error --metrics=off \
            app/

  # 3. SCA
  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: pip-audit
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements.txt --strict

  # 4. Tests unitaires
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  # 5. Build + scan Trivy + DAST (uniquement si les contrôles précédents passent)
  build-scan-dast:
    name: Build, Trivy & DAST (ZAP)
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast, sca, test]
    permissions:
      contents: read
      security-events: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: Trivy - rapport SARIF (informatif)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF vers l'onglet Security
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Trivy - QUALITY GATE (bloque si CVE HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Lancer le conteneur pour le DAST
        run: |
          docker run -d --name api -p 5000:5000 $IMAGE_NAME:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fs http://localhost:5000/health && break || sleep 2
          done
          curl -fs http://localhost:5000/health

      - name: DAST - OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:5000
          rules_file_name: zap/rules.tsv
          cmd_options: "-a"
          fail_action: true

      - name: Logs conteneur (debug)
        if: failure()
        run: docker logs api

      - name: Archiver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-results.sarif
            report_html.html
            report_md.md
            report_json.json
